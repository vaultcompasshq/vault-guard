# Guardrail policy. One file for every gate this repository runs.
#
# Gates are keyed by the ROLE they fill, and the product filling that role
# is one line inside it. Swapping or renaming a product is a one-line edit
# rather than a rename of the key your CI reads.
#
# There is deliberately no shared severity threshold. Each gate keeps its
# own, spelled the way that gate spells it, inside its own options block.
#
# stage says when a gate runs: commit, push, or ci. Stages are cumulative,
# so a gate runs at its own stage and at every later one, and a run at ci
# runs everything enabled. The values below are the defaults.
#
# enforce defaults to true. Add enforce: false to a gate to make it run
# and report without ever changing the exit code, which is how a gate is
# adopted before anybody is ready to have it refuse a commit.
version: 1

gates:
  # what comes in: hallucinated names, typosquats, tampered lockfile entries
  #
  # Every gate below runs from a PUBLISHED package in node_modules, this
  # repository's own product included, rather than from the build in the
  # working tree. That is deliberate. It keeps the CI job to an install and
  # a run with no build step in front of it, and it means the gates are the
  # same code a user installs rather than a local build nobody else has.
  dependencies:
    product: dep-guard
    enabled: true
    stage: commit
    # Handed to this gate unchanged. Keys are its own long flags,
    # without the leading dashes. Example: fail-on: high
    options: {}
  # what goes out: credentials about to be committed
  secrets:
    product: vault-guard
    enabled: true
    stage: commit
    # Handed to this gate unchanged. Keys are its own long flags,
    # without the leading dashes. Example: fail-on: high
    options: {}
  # what was approved: drift from a frozen intent contract, and change budgets
  intent:
    product: intent-guard
    enabled: true
    stage: ci
    # Adoption ramp: intent runs and reports in CI but never fails the run.
    # Flip to true once a few pull requests show the signal is worth blocking on.
    enforce: false
    # Handed to this gate unchanged. Keys are its own long flags,
    # without the leading dashes. Example: fail-on: high
    options: {}

report:
  format: text
