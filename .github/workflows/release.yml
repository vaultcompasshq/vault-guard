name: Release
#
# Two kinds of release come through here, decided by the "Decide the
# release kind" step below:
#
#   * a PACKAGE release, where the tag reads "v" + the version every
#     published package carries. Everything in this file runs.
#   * an ACTION-ONLY release, where the tag moves past the scanner version
#     and the packages stay where they are: action.yml, README, CHANGELOG
#     and docs moved, no package did. The code gates above still run on
#     it -- they are what covers the action.yml and docs such a release
#     actually ships. What is skipped is everything that exists to protect
#     a publish that does not happen: the packed-tarball hygiene check,
#     the npm upgrade for OIDC trusted publishing, and the publish itself.
#     The run then resolves the tag and cuts a GitHub Release saying
#     nothing was published.
#
# scripts/lib/release-kind.mjs holds the rules for telling the two apart
# and the reasoning behind each one; scripts/tests/release-kind.test.mjs
# holds the cases, including a canary against the real action.yml and the
# real CHANGELOG.md. Ported from dep-guard's release.yml -- see that
# repository's docs/INVARIANTS.md, "The action tag and the scanner version
# are two numbers", for the longer history. This repository has no
# equivalent invariants doc yet, so this comment and the ones on the
# decision step and the gated steps below are where that reasoning lives
# here.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Serializes every release attempt across the whole repository, tag
# triggered or workflow_dispatch, so a manual re-run overlapping a
# tag-triggered run cannot both pass the "already published" check before
# either publishes and race each other into a rejected duplicate-version
# publish. Never cancel a run mid-publish; queue the next one instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Install, build, and test live here, and this job has no id-token.
  # The release job below publishes tarballs this job packed. It does not
  # install this repository's dependencies. The scope of that split is the
  # publish token only: the tarballs are still built in this job, where
  # dependency install scripts run, so the split keeps those scripts away
  # from the token and does not by itself guarantee the integrity of the
  # built output.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      scanner_version: ${{ steps.kind.outputs.scanner_version }}
      # Exactly "true" or "false", written by the decision step, and only
      # after every condition in scripts/lib/release-kind.mjs held.
      #
      # Every condition that reads it is spelled POSITIVELY -- publish-side
      # steps run on "== 'false'", the action-only Release body on
      # "== 'true'" -- never "!= 'true'". The difference only shows up when
      # the value is neither: an output that is empty or missing (a step
      # renamed, an id typo, a future edit that fails to set it) makes
      # "!= 'true'" TRUE, which would publish on a run that never decided
      # anything. Both spellings are equally readable and only one of them
      # fails closed.
      action_only: ${{ steps.kind.outputs.action_only }}

    steps:
    # Runs before checkout on purpose: GITHUB_REF and github.event_name are
    # populated from the trigger itself, not from anything in the tree, so
    # this needs nothing checked out to decide. workflow_dispatch has no
    # branch restriction of its own, so a manual run started from any other
    # branch would build and publish THAT branch's code under the version
    # its package.json files happen to carry -- an unreviewed, un-tagged
    # publish. An explicit failing step is used instead of a job-level "if:"
    # so a maintainer who fat-fingers the branch dropdown gets a loud,
    # legible error naming the ref, rather than a run that silently reports
    # "skipped" with no explanation.
    #
    # The tag-push trigger is NOT inherently restricted to main the way the
    # comment here used to imply: "git tag v0.1.0 <any-commit> && git push
    # --tags" fires this workflow from any commit, on or off main, with a
    # real tag and matching GitHub Release. See the ancestry check in
    # "Decide the release kind, and refuse a tag that is neither" below for
    # how the tag path guards against that.
    - name: Refuse workflow_dispatch from anywhere but main
      if: github.event_name == 'workflow_dispatch'
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
          echo "::error::Manual workflow_dispatch run from '${GITHUB_REF}', not 'refs/heads/main'. A manual dispatch from any other branch would build and publish that branch's code. Re-run from main, or push a 'v*' tag instead."
          exit 1
        fi

    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22.14.0
        cache: 'pnpm'

    # Runs before pnpm install on purpose: every mistake this catches is a
    # human mistake made at tag time -- a mistyped tag, a version left
    # unbumped, a forgotten CHANGELOG entry -- and none of it depends on
    # anything install, build or test produce. scripts/classify-release-tag.mjs
    # reads the four packages' package.json files via "node -p", talks to
    # the npm registry on the action-only path only, and uses node builtins
    # only (no dependency of this repository is installed yet, and that
    # script must keep it that way).
    #
    # Two assertions, both fatal:
    #   1. when this run is tag-triggered, the tag must be one of the two
    #      release shapes this repository has, and the script decides
    #      WHICH -- that is the "action_only" output every later step
    #      reads. A tag equal to "v" + the version every package carries is
    #      a package release, and everything proceeds as it always has.
    #      Any other tag is an action-only CANDIDATE, and is refused unless
    #      it is exact semver, strictly greater than the package version by
    #      numeric ordering, written down as a "## [X.Y.Z]" entry in
    #      CHANGELOG.md at the tagged commit, backed by every published
    #      package already being on the npm registry at that package
    #      version, and matched by action.yml's own version default. The
    #      package path is checked too, not merely admitted: it requires
    #      action.yml's version default to equal the version being
    #      published, since otherwise the tag the release creates installs
    #      a different scanner than the release put on npm.
    #      scripts/lib/release-kind.mjs holds those rules and the
    #      reasoning for each; scripts/tests/release-kind.test.mjs holds
    #      the cases, registry lookup and all, which is why this is a
    #      script rather than more lines of bash here. This half only
    #      applies to a tag push -- workflow_dispatch has no tag at all
    #      (GITHUB_REF_TYPE is "branch") and is covered instead by the ref
    #      guard above.
    #   2. when this run is tag-triggered, the tagged commit must be an
    #      ancestor of origin/main. "git tag v0.1.0 <any-commit> && git push
    #      --tags" fires this workflow from any commit, on or off main; a
    #      tag on a side branch would otherwise walk straight into an OIDC
    #      trusted publish around branch protection, with a real tag and a
    #      matching GitHub Release to show for it. This applies to BOTH
    #      kinds of release: an action-only tag publishes nothing, but it
    #      still moves the ref people write in "uses:", which is the thing
    #      actually running inside their workflows.
    #
    # The script writes action_only and scanner_version to $GITHUB_OUTPUT
    # itself, so nothing here parses its stdout.
    - name: Decide the release kind, and refuse a tag that is neither
      id: kind
      run: |
        set -euo pipefail
        CORE_NAME="$(node -p "require('./packages/core/package.json').name")"
        CORE_VERSION="$(node -p "require('./packages/core/package.json').version")"
        CLI_NAME="$(node -p "require('./packages/cli/package.json').name")"
        CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
        MCP_NAME="$(node -p "require('./packages/mcp/package.json').name")"
        MCP_VERSION="$(node -p "require('./packages/mcp/package.json').version")"
        TELEMETRY_NAME="$(node -p "require('./packages/telemetry/package.json').name")"
        TELEMETRY_VERSION="$(node -p "require('./packages/telemetry/package.json').version")"

        # GITHUB_REF_TYPE is always set by Actions (a branch name on
        # workflow_dispatch, a tag name on a tag push). The script's answer
        # for a run without --tag is always "package release".
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          node scripts/classify-release-tag.mjs \
            --tag "${GITHUB_REF_NAME}" \
            --package "${CORE_NAME}=${CORE_VERSION}" \
            --package "${CLI_NAME}=${CLI_VERSION}" \
            --package "${MCP_NAME}=${MCP_VERSION}" \
            --package "${TELEMETRY_NAME}=${TELEMETRY_VERSION}" \
            --action-yml action.yml \
            --changelog CHANGELOG.md

          # The checkout step above uses actions/checkout's default
          # fetch-depth (1), so this job's working copy holds only the
          # tagged commit itself, with no history connecting it to
          # origin/main and no origin/main ref at all yet. Unshallow first
          # (only when the repo actually is shallow -- calling --unshallow
          # on a complete repo is a hard error, and nothing above this step
          # promises which one this checkout is), then fetch main by name
          # into an explicit local ref, since a tag-triggered checkout
          # never sets one up on its own.
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --unshallow origin
          fi
          git fetch origin main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of origin/main. A tag pushed at a commit off main would otherwise walk straight into an OIDC trusted publish around branch protection, and an action-only tag at such a commit would ship that commit's action.yml to everyone who pins the tag. Refusing to release."
            exit 1
          fi
        else
          node scripts/classify-release-tag.mjs \
            --package "${CORE_NAME}=${CORE_VERSION}" \
            --package "${CLI_NAME}=${CLI_VERSION}" \
            --package "${MCP_NAME}=${MCP_VERSION}" \
            --package "${TELEMETRY_NAME}=${TELEMETRY_VERSION}" \
            --action-yml action.yml \
            --changelog CHANGELOG.md
        fi

        echo "Release kind decided: ref_type=${GITHUB_REF_TYPE} ref_name=${GITHUB_REF_NAME}"

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    - name: Regenerate docs/RULES.md and check for drift
      run: node scripts/gen-rules-doc.cjs && git diff --exit-code docs/RULES.md

    - name: Run tests with coverage
      run: pnpm test:coverage

    # The release-kind decision above is covered by its own suite rather
    # than pnpm test:coverage, since it lives outside every package's own
    # tests directory. Runs on both kinds of release, same as every other
    # code gate here: the decision step ran before this suite could, so a
    # regression here would only be caught after the fact, but it is what
    # keeps the parser and the workflow wiring honest between releases.
    - name: Run release-kind tests
      run: pnpm test:release-kind

    # Runs here as well as in ci.yml. CI gates the pull request; this gates
    # the tag. Without it a release cut from a branch that never opened a
    # pull request, or an admin merge during a CI outage, could publish a
    # tarball carrying a private codename or an internal path, which is the
    # one thing this guard exists to make impossible.
    - name: Check for private portfolio references
      run: pnpm check:private-names

    - name: Assert CHANGELOG.md documents this version
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qF "## [${version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing the ## [${version}] entry for this release."
            exit 1
          fi
        else
          echo "Not a tag push; skipping the CHANGELOG entry check."
        fi

    # Skipped on an action-only release: nothing publishes on that path, so
    # there is no packed tarball for this to check the hygiene of.
    - name: Verify publish hygiene (no source maps or test artifacts in tarballs)
      if: steps.kind.outputs.action_only == 'false'
      run: pnpm check:pack

    # pnpm pack rewrites workspace:* to a real range, the same rewrite
    # publish used to do. Packages are packed and later published in
    # dependency order. The VS Code extension is Marketplace-only and is
    # not packed. An action-only tag packs nothing.
    #
    # "pnpm --dir", never "pnpm --filter": on pnpm 9, the version
    # packageManager pins, "--filter ... pack" in this workspace exits 1
    # with "Unknown option: 'recursive'". The destination is absolute
    # because with --dir a relative one resolves under the package
    # directory, not the repository root the upload step reads.
    - name: Pack the publishable tarballs
      if: steps.kind.outputs.action_only == 'false'
      run: |
        set -euo pipefail
        mkdir -p pack-out/core pack-out/telemetry pack-out/cli pack-out/mcp
        pnpm --dir packages/core pack --pack-destination "${GITHUB_WORKSPACE}/pack-out/core"
        pnpm --dir packages/telemetry pack --pack-destination "${GITHUB_WORKSPACE}/pack-out/telemetry"
        pnpm --dir packages/cli pack --pack-destination "${GITHUB_WORKSPACE}/pack-out/cli"
        pnpm --dir packages/mcp pack --pack-destination "${GITHUB_WORKSPACE}/pack-out/mcp"

    # Each pack-out directory must hold exactly one tarball, and the
    # package.json inside it must carry the name and version of the package
    # it was packed from. A pack that silently produced nothing, or packed
    # the wrong package, stops here, before anything leaves this job.
    - name: Check the packed tarballs match their packages
      if: steps.kind.outputs.action_only == 'false'
      run: |
        set -euo pipefail
        for dir in core telemetry cli mcp; do
          shopt -s nullglob
          tarballs=(pack-out/"${dir}"/*.tgz)
          shopt -u nullglob
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "::error::pack-out/${dir} holds ${#tarballs[@]} tarballs, expected exactly one."
            exit 1
          fi
          want="$(node -p "const p = require('./packages/${dir}/package.json'); p.name + '@' + p.version")"
          got="$(tar -xzOf "${tarballs[0]}" package/package.json | node -p "const p = JSON.parse(require('fs').readFileSync(0, 'utf8')); p.name + '@' + p.version")"
          if [[ "${got}" != "${want}" ]]; then
            echo "::error::pack-out/${dir} holds ${got}, expected ${want} from packages/${dir}/package.json."
            exit 1
          fi
          echo "pack-out/${dir}: ${got}"
        done

    - name: Upload the packed tarballs
      if: steps.kind.outputs.action_only == 'false'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: npm-pack
        path: |
          pack-out/core/*.tgz
          pack-out/telemetry/*.tgz
          pack-out/cli/*.tgz
          pack-out/mcp/*.tgz
        if-no-files-found: error
        retention-days: 1

    - name: Resolve release tag
      id: meta
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
        else
          echo "tag=v$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"
        fi

  # Trusted publishing stays on this job only. It downloads the tarballs
  # prepare packed and does not install this repository's dependencies.
  # npm CLI >= 11.5.1 is required for OIDC; Node 22.14 does not ship it.
  # Pin major 11: npm@12 needs a newer Node than this job runs.
  release:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      action_only: ${{ needs.prepare.outputs.action_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing
        if: needs.prepare.outputs.action_only == 'false'
        run: npm install -g npm@11

      - name: Download the packed tarballs
        if: needs.prepare.outputs.action_only == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-pack
          path: pack-out

      # Only @vaultcompass/* packages. Never vault-guard-vscode (Marketplace
      # via vsce). Skip a version already on the registry so a failed
      # mid-release can be re-run. Core, then telemetry, then the CLI, then
      # mcp: the same order the old publish loop used.
      - name: Publish to npm
        if: needs.prepare.outputs.action_only == 'false'
        run: |
          set -euo pipefail
          publish_one() {
            dir="$1"
            pack_dir="$2"
            name="$(node -p "require('./${dir}/package.json').name")"
            ver="$(node -p "require('./${dir}/package.json').version")"
            if [[ "$(npm view "${name}@${ver}" version 2>/dev/null || true)" == "${ver}" ]]; then
              echo "Skip ${name}@${ver} (already on registry)"
              return 0
            fi
            echo "Publishing ${name}@${ver}"
            tarball="$(find "${pack_dir}" -name '*.tgz' -print)"
            test -n "${tarball}"
            # A leading ./ is always a local file spec to npm; a bare dir/file.tgz
            # with one slash is read as the GitHub shorthand owner/repo.
            npm publish "./${tarball}" --access public
          }
          publish_one packages/core pack-out/core
          publish_one packages/telemetry pack-out/telemetry
          publish_one packages/cli pack-out/cli
          publish_one packages/mcp pack-out/mcp

      # Two Release steps, one per release kind, rather than one step with a
      # computed body. The body is the only difference between them, and it
      # is the part that must not be wrong: "Published ... to npm" appears
      # under exactly one condition, the same condition that let the publish
      # step run at all, so an action-only release cannot announce a publish
      # that did not happen.
      - name: Create GitHub Release
        if: needs.prepare.outputs.action_only == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Published `@vaultcompass/vault-guard`, `@vaultcompass/vault-guard-core`, `@vaultcompass/vault-guard-mcp`, and `@vaultcompass/vault-guard-telemetry` to npm (VS Code extension is Marketplace-only, not npm). See [CHANGELOG.md](https://github.com/vaultcompasshq/vault-guard/blob/main/CHANGELOG.md).

      # The action-only body. It has to answer the question a reader of this
      # Release page actually has: the tag moved, so what am I getting? That
      # answer is a scanner version that did not move with it.
      - name: Create GitHub Release (action-only)
        if: needs.prepare.outputs.action_only == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Action-only release. `${{ needs.prepare.outputs.tag }}` moves the composite action; the scanner it installs stays at `${{ needs.prepare.outputs.scanner_version }}`, which was already on npm before this tag.

            Nothing was published to npm by this release.

            See CHANGELOG.md for what changed.

  smoke-published:
    name: Smoke test published CLI
    needs: release
    # Nothing was published on an action-only release, so there is nothing
    # here to smoke test: every command below installs
    # @vaultcompass/vault-guard at the version derived from the tag, and on
    # an action-only tag that version does not exist on the registry and
    # never will.
    if: needs.release.outputs.action_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fixture only)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install published package and assert scan fails on fixture
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="$(node -p "require('./packages/cli/package.json').version")"
          fi
          echo "Smoke testing @vaultcompass/vault-guard@${VERSION}"

          FOUND=0
          # About 20 minutes (80 attempts, 15 seconds apart). The registry can
          # serve the version metadata minutes before the tarball, and
          # "npm install" fetches the tarball, so both must be ready.
          for i in $(seq 1 80); do
            if [[ "$(npm view "@vaultcompass/vault-guard@${VERSION}" version 2>/dev/null)" == "${VERSION}" ]]; then
              TARBALL="$(npm view "@vaultcompass/vault-guard@${VERSION}" dist.tarball 2>/dev/null || true)"
              if [[ -n "${TARBALL}" ]] && curl -sfI -o /dev/null "${TARBALL}"; then
                echo "Package and tarball visible on registry."
                FOUND=1
                break
              fi
            fi
            echo "Waiting for npm registry and tarball (attempt ${i}/80)..."
            sleep 15
          done
          if [[ "${FOUND}" -ne 1 ]]; then
            echo "::error::Timed out after about 20 minutes waiting for @vaultcompass/vault-guard@${VERSION} and its tarball on the npm registry."
            exit 1
          fi

          WORK="${GITHUB_WORKSPACE}"
          FIXTURE="${WORK}/fixtures/release-smoke"
          TMP=$(mktemp -d)
          cd "${TMP}"
          npm init -y >/dev/null 2>&1
          npm install "@vaultcompass/vault-guard@${VERSION}"

          set +e
          ./node_modules/.bin/vault-guard scan "${FIXTURE}" --format json > smoke-out.json 2>smoke-err.log
          EC=$?
          set -e

          if [[ "${EC}" -eq 0 ]]; then
            echo "::error::Expected vault-guard scan to exit non-zero (fixture contains a synthetic secret pattern)."
            cat smoke-err.log || true
            exit 1
          fi

          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('smoke-out.json', 'utf8'));
            const n = j.summary && j.summary.secrets;
            if (!(typeof n === 'number' && n > 0)) {
              console.error('Bad JSON summary', j);
              process.exit(1);
            }
          "
          echo "Release smoke passed."
